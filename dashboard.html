<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Peserta - PT. Sinergi Cendekia Investama</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container { margin-top: 120px; padding-bottom: 60px; }
        .dashboard-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 25px; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .status-card { background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; border-bottom: 4px solid var(--primary-color); }
        .status-card h4 { font-size: 20px; color: var(--primary-color); margin-top: 5px; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white; padding: 15px 25px; border-radius: 8px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 2000; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo logo-wrapper">
                    <div class="logo-icon">P</div>
                    <div>PT. <span>Sinergi Cendekia Investama</span></div>
                </a>
                <div class="menu">
                    <span id="navNama" style="font-weight: bold; color: var(--primary-color); margin-right: 15px;">Halo, Peserta</span>
                    <a href="login.html" onclick="localStorage.removeItem('session_email')" style="color: red; font-weight: bold; text-decoration: none;">Keluar</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container dashboard-container animate-fade">
        <div class="dashboard-card" style="display: flex; align-items: center; gap: 20px;">
            <img src="https://dicebear.com" alt="Avatar" style="width: 70px; height: 70px; border-radius: 50%; background: #eee;">
            <div>
                <h3 id="cardNama" style="color: var(--primary-color);">Memuat Nama...</h3>
                <p>Status Log: <strong id="cardEmail" style="color: #666;">-</strong></p>
            </div>
        </div>

        <div class="dashboard-card">
            <h3 style="color: var(--primary-color); border-bottom: 2px solid #eee; padding-bottom: 10px;">Status Progres Uji Kompetensi & Lab</h3>
            <div class="status-grid">
                <div class="status-card">
                    <p>Berkas Administrasi</p>
                    <h4 id="txtStatusAdmin" style="color: #ffc107;">Mengecek...</h4>
                </div>
                <div class="status-card">
                    <p>Nilai Teori / Lab</p>
                    <h4 id="txtNilai">-</h4>
                </div>
                <div class="status-card">
                    <p>Rekomendasi BNSP</p>
                    <h4 id="txtRekomendasi">-</h4>
                </div>
            </div>
        </div>

        <div class="dashboard-card" id="formUploadSection">
            <h3 style="color: var(--primary-color); margin-bottom: 15px;">Form Pengajuan Skema Sertifikasi (Pra-Asesmen)</h3>
            <form onsubmit="submitPortofolio(event)">
                <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                    <label style="font-weight: 600; display: block; margin-bottom: 5px;">Pilih Skema Keahlian</label>
                    <select id="pilihanSkema" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                        <option value="">-- Pilih Skema Sertifikasi --</option>
                        <option value="Junior Web Developer">Junior Web Developer (Teknologi Informasi)</option>
                        <option value="Akuntan Madya">Akuntan Madya (Bisnis)</option>
                        <option value="Teknisi Laboratorium">Teknisi Laboratorium Dasar (Sains/Teknis)</option>
                    </select>
                </div>
                <button type="submit" id="btnKirimBerkas" class="btn" style="width: 100%;">Ajukan Berkas & Skema Uji</button>
            </form>
        </div>
    </div>

    <div id="toastNotification" class="toast-container"></div>

    <script>
        // Ambil data user yang sedang login aktif
        const sessionEmail = localStorage.getItem("session_email");
        if(!sessionEmail || sessionEmail === "assesor_active") {
            alert("Sesi habis atau tidak valid. Silakan login kembali.");
            window.location.href = "login.html";
        }

        const userData = JSON.parse(localStorage.getItem(sessionEmail));
        
        // Tampilkan data ke HTML secara dinamis
        document.getElementById('navNama').innerText = "Halo, " + userData.nama;
        document.getElementById('cardNama').innerText = userData.nama;
        document.getElementById('cardEmail').innerText = userData.email;
        document.getElementById('txtStatusAdmin').innerText = userData.statusAdmin;
        
        if(userData.statusAdmin === "Menunggu Validasi Asesor") {
            document.getElementById('txtStatusAdmin').style.color = "#0d6efd";
            document.getElementById('formUploadSection').innerHTML = "<p style='color: green; font-weight: bold; text-align: center;'>Berkas Anda telah berhasil disimpan di memori browser dan sedang menunggu penilaian dari Assesor.</p>";
        } else if(userData.statusAdmin === "Sertifikat Terbit") {
            document.getElementById('txtStatusAdmin').style.color = "#28a745";
            document.getElementById('formUploadSection').style.display = "none";
        }

        document.getElementById('txtNilai').innerText = `T: ${userData.nilaiTeori} / L: ${userData.nilaiLab}`;
        document.getElementById('txtRekomendasi').innerText = userData.rekomendasi;

        function submitPortofolio(event) {
            event.preventDefault();
            const skema = document.getElementById('pilihanSkema').value;
            
            // Perbarui data objek lokal
            userData.statusAdmin = "Menunggu Validasi Asesor";
            userData.rekomendasi = "Proses Peninjauan";
            
            // Simpan kembali perubahan ke localStorage secara permanen
            localStorage.setItem(sessionEmail, JSON.stringify(userData));

            // Munculkan notifikasi toast modern
            const toast = document.getElementById('toastNotification');
            toast.innerText = `Sukses mengajukan skema ${skema}! Data tersimpan.`;
            toast.style.display = "block";
            
            setTimeout(() => {
                window.location.reload();
            }, 1500);
        }
    </script>
</body>
</html>

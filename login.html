<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PT. Sinergi Cendekia Investama</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; padding-top: 80px; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo logo-wrapper">
                    <div class="logo-icon">P</div>
                    <div>PT. <span>Sinergi Cendekia Investama</span></div>
                </a>
                <div class="menu">
                    <a href="index.html">Beranda</a>
                    <a href="layanan.html">Layanan</a>
                    <a href="faq.html">Bantuan</a>
                    <a href="login.html" class="active">Masuk</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="login-section animate-fade">
        <div class="login-card">
            <h2>Selamat Datang</h2>
            <p style="color: #666; margin-bottom: 30px; font-size: 14px;">Silakan masuk ke Portal Sertifikasi Anda</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Terdaftar</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                    <!-- Tombol Toggle Mata -->
                    <span class="toggle-password" onclick="togglePasswordVisibility('pass', this)">LIHAT</span>
                    <a href="lupa_password.html" style="display: block; text-align: right; font-size: 12px; margin-top: 5px; color: #666; text-decoration: none;">Lupa kata sandi?</a>
                </div>
                <button type="submit" id="btnLogin" class="btn" style="width: 100%; padding: 15px;">Masuk ke Portal</button>
            </form>
            <div style="margin-top: 25px; font-size: 14px; color: #666;">
                Belum punya akun? <a href="daftar.html" style="color: var(--primary-color); font-weight: bold; text-decoration: none;">Daftar Akun Peserta</a><br><br>
                <small style="color: #999;">Petunjuk: Gunakan email kata "assesor" (ex: assesor@pancasila.com) untuk masuk ke panel Penguji.</small>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('btnLogin');

            btn.innerHTML = "Memverifikasi Kredensial...";
            btn.disabled = true;

            setTimeout(() => {
                // 1. Cek Ciri Akun Assesor
                if(email.includes("assesor")) {
                    alert("Akses Diterima: Masuk sebagai Dosen/Assesor.");
                    localStorage.setItem("session_email", "assesor_active");
                    window.location.href = "dashboard_assesor.html";
                    return;
                }

                // 2. Cek Real Data dari LocalStorage untuk Peserta
                const registeredUser = localStorage.getItem(email);
                if (registeredUser) {
                    const userObj = JSON.parse(registeredUser);
                    if (userObj.password === pass) {
                        localStorage.setItem("session_email", email); // Set active session
                        alert(`Login Berhasil! Selamat Datang Kembali, ${userObj.nama}`);
                        window.location.href = "dashboard.html";
                    } else {
                        alert("Kesalahan: Kata sandi yang Anda masukkan salah.");
                        btn.innerHTML = "Masuk ke Portal";
                        btn.disabled = false;
                    }
                } else {
                    alert("Kesalahan: Email belum terdaftar di sistem browser ini.");
                    btn.innerHTML = "Masuk ke Portal";
                    btn.disabled = false;
                }
            }, 1000);
        }
        function togglePasswordVisibility(inputId, element) {
            const passwordInput = document.getElementById(inputId);
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                element.innerText = "SEMBUNYI";
                element.style.color = "var(--primary-color)";
            } else {
                passwordInput.type = "password";
                element.innerText = "LIHAT";
                element.style.color = "#666";
            }
        }
    </script>
</body>
</html>

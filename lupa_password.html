<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - PT. Sinergi Cendekia Investama</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; padding-top: 80px; }
        .reset-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">PT. <span>Sinergi Cendekia Investama</span></a>
            </nav>
        </div>
    </header>

    <div class="reset-section animate-fade">
        <div class="reset-card">
            <h2>Lupa Kata Sandi?</h2>
            <p style="margin-bottom: 25px; color: #666;">Masukkan email Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.</p>
            <form onsubmit="handleReset(event)">
                <div class="form-group" style="text-align: left;">
                    <label>Email Terdaftar</label>
                    <input type="email" id="emailReset" placeholder="nama@email.com" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <button type="submit" id="btnReset" class="btn" style="width: 100%; margin-top: 15px;">Kirim Link Reset</button>
            </form>
            <div style="margin-top: 20px;">
                <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-size: 14px;">Kembali ke Login</a>
            </div>
        </div>
    </div>

    <script>
        function handleReset(event) {
            event.preventDefault();
            const btn = document.getElementById('btnReset');
            btn.innerHTML = "Mengirim...";
            setTimeout(() => {
                alert("Berhasil!\nInstruksi pengaturan ulang kata sandi telah dikirim ke email Anda.");
                window.location.href = "login.html";
            }, 1500);
        }
    </script>
</body>
</html>
